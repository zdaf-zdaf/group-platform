name: Forum Service CI/CD

on:
  push:
    paths:
      - 'backend/forum_service/**'  # 只监控forum-service目录的变更
    branches: [ "master" ]
  pull_request:
    paths:
      - 'backend/forum_service/**'
    branches: [ "master" ]

jobs:
  test-forum-service:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: forum_db
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./forum-service

      - name: Wait for MySQL
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
              echo "MySQL is ready!"; break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"; sleep 2
          done

      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./forum-service
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: forum_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      - name: Run unit tests
        run: python manage.py test --verbosity=2
        working-directory: ./forum-service
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: forum_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  build-and-push-forum-service:
    runs-on: ubuntu-latest
    needs: test-forum-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push forum service image
        uses: docker/build-push-action@v5
        with:
          context: ./forum-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forum-service:latest
            ghcr.io/${{ github.repository_owner }}/forum-service:${{ github.sha }}

