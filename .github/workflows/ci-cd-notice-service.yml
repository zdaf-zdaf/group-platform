name: Notice Service CI/CD

on:
  push:
    paths:
      - 'backend/notice-service/**'  # 只监控notice-service目录的变更
    branches: [ "master" ]
  pull_request:
    paths:
      - 'backend/notice-service/**'
    branches: [ "master" ]

jobs:
  test-notice-service:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: notice_db
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./notice-service

      - name: Wait for MySQL
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
              echo "MySQL is ready!"; break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"; sleep 2
          done

      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./notice-service
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: notice_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      - name: Run unit tests
        run: python manage.py test --verbosity=2
        working-directory: ./notice-service
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: notice_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  build-and-push-notice-service:
    runs-on: ubuntu-latest
    needs: test-notice-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push notice service image
        uses: docker/build-push-action@v5
        with:
          context: ./notice-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/notice-service:latest
            ghcr.io/${{ github.repository_owner }}/notice-service:${{ github.sha }}

  deploy-notice-service:
    runs-on: ubuntu-latest
    needs: build-and-push-notice-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate deployment script for notice service
        run: |
          cat > deploy-notice-service.sh << 'EOF'
          #!/bin/bash
          echo "Deploying Notice Service..."
          
          # Update image version
          sed -i "s|image:.*notice-service:.*|image: ghcr.io/${{ github.repository }}/notice-service:${{ github.sha }}|g" notice-service/k8s/deployment.yaml
          
          # Apply Kubernetes configuration
          kubectl apply -f notice-service/k8s/
          
          echo "Notice Service deployed!"
          EOF
          
          chmod +x deploy-notice-service.sh

      - name: Upload deployment script
        uses: actions/upload-artifact@v4
        with:
          name: notice-service-deployment
          path: deploy-notice-service.sh