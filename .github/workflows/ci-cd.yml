name: group-pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ================== 后端测试（容器化） ==================
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for MySQL ready and configure root
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
              echo "MySQL is ready!"; break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"; sleep 2
          done
          mysql -h"127.0.0.1" -uroot -prootpassword -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpassword';
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpassword';
            FLUSH PRIVILEGES;"
      - name: Build backend image
        run: docker build -t course-backend:latest ./backend

      - name: Run backend container with docker.sock
        run: |
          docker run -d --name course-backend-container \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DJANGO_SETTINGS_MODULE=server.settings \
            -e DB_ENGINE=django.db.backends.mysql \
            -e DB_NAME=test_db \
            -e DB_USER=root \
            -e DB_PASSWORD=rootpassword \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DEBUG=False \
            course-backend:latest
      - name: Run migrations in backend container
        run: |
          docker exec course-backend-container python manage.py makemigrations --noinput
          docker exec course-backend-container python manage.py migrate --noinput
      - name: Run Django tests in backend container
        run: docker exec course-backend-container python manage.py test --verbosity=2

  # 并行论坛测试
  api-test-luntan:
    name: Parallel Forum Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    services:
      mysql-luntan:  # 服务名称唯一
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_luntan  # 独立的数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3307:3306  # 使用不同端口映射

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3307）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3307 -uroot -prootpassword --silent; then
                echo "MySQL for Luntan is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
    #  新增：执行数据库迁移
      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_luntan
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DEBUG: False

      - name: Start Django Server (Port 8001)
        run: |
            python manage.py runserver 127.0.0.1:8001 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_luntan  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3307  # 使用3307端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Forum Tests
        run: |
            newman run postman/collection1-LunTan.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8001/api" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8001" || true
  # 并行实验测试（配置类似，但使用不同端口和数据库名）
  api-test-lab:
    name: Parallel Lab Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    services:
      mysql-lab:
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_lab  # 独立数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3308:3306  # 不同端口

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3308）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3308 -uroot -prootpassword --silent; then
                echo "MySQL for Lab is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
    #  新增：执行数据库迁移
      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_lab
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DEBUG: False

      - name: Start Django Server (Port 8002)
        run: |
            python manage.py runserver 127.0.0.1:8002 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_lab  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3308  # 使用3308端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Lab Tests
        run: |
            newman run postman/collection2-Lab.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8002/api" \
            --reporters cli
      - name: Display Server Logs on Failure
        if: failure()  
        run: |
            echo "===== Django Server Logs ====="
            cat backend/debug.log  # 假设服务器日志输出到backend/debug.log
            echo "===== End Logs ====="
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8002" || true
  # 并行公告测试（配置类似，但使用不同端口和数据库名）
  api-test-gonggao:
    name: Parallel Announcement Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    services:
      mysql-gonggao:
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_gonggao  # 独立数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3309:3306  # 不同端口

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3309）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3309 -uroot -prootpassword --silent; then
                echo "MySQL for GongGao is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
    # 新增：执行数据库迁移
      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_gonggao
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3309
          DEBUG: False

      - name: Start Django Server (Port 8003)
        run: |
            python manage.py runserver 127.0.0.1:8003 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_gonggao  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3309  # 使用3309端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Announcement Tests
        run: |
            newman run postman/collection3-GongGao.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8003/api" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8003" || true


    # 并行学习资料测试
  api-test-ziliao:
    name: Parallel Learning Materials Tests
    runs-on: ubuntu-latest
    needs: [test-backend] # 依赖后端单元测试
    
    services:
      mysql-ziliao:  # 服务名称唯一
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_ziliao  # 独立的数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3310:3306  # 使用新端口（3310）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3310）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3310 -uroot -prootpassword --silent; then
                echo "MySQL for Learning Materials is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done

      - name: Start Django Server (Port 8004)
        run: |
            python manage.py runserver 0.0.0.0:8004 &
            sleep 5
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_ziliao  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3310  # 使用3310端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Learning Materials Tests
        run: |
            newman run postman/collection4-ziliao.json \
            --environment postman/materials_environment.json \
            --env-var "baseUrl=http://127.0.0.1:8004" \
            --reporters cli

      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8004" || true

  gui-test-cypress:
    name: Run Cypress GUI Tests
    runs-on: ubuntu-latest
    needs: [test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao]
    
    services:
      mysql-gui:
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_gui
            MYSQL_ROOT_HOST: '%'
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3306:3306
        options: >-
            --health-cmd="mysqladmin ping"
            --health-interval=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        # 下载修复后的依赖文件 - 关键修复
      - name: Download fixed dependencies
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

        # 创建日志目录
      - name: Create log directory
        run: mkdir -p logs

        # =============== 后端服务设置 ===============
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用标准端口3306）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
                echo "MySQL for GUI is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
            
            # 确保root用户权限
            mysql -h127.0.0.1 -uroot -prootpassword -e "
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'rootpassword';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;"
        
      - name: Run migrations
        run: |
            python manage.py makemigrations --noinput
            python manage.py migrate --noinput
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_gui  # 使用正确的数据库名
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3306  # 使用标准端口3306
            DEBUG: False
        
        # =============== 后端服务设置 ===============
      - name: Start Django server
        run: |
            # 禁用认证中间件并允许匿名访问
            python manage.py runserver 0.0.0.0:8000 --insecure --settings=server.test_settings > ../logs/django.log 2>&1 &
            echo $! > ../logs/django.pid
        working-directory: ./backend
        env:
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_gui
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
        
      # =============== 前端服务设置 ===============
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Vue dependencies
        run: |
          # 清理缓存和旧依赖
          npm cache clean --force
          rm -rf node_modules
          rm -f package-lock.json
          
          # 安装 Vue 项目依赖
          npm install --legacy-peer-deps
          
          # 验证 Vue 相关依赖
          npm list vue @vue/cli-service || echo "Vue dependencies not found"
        working-directory: ./frontend

      - name: Start Vue server
        run: |
          # Vue 项目的启动命令通常是 npm run serve
          npm run serve -- --port 3000 > ../logs/vue.log 2>&1 &
          echo $! > ../logs/vue.pid
        working-directory: ./frontend
      
      # =============== 测试执行 ===============
      - name: Wait for servers with timeout
        run: |
          npm install -g wait-on
          
          # 设置超时时间（最多等待2分钟）
          timeout 120s wait-on http://localhost:3000 http://localhost:8000 || true
          
          # 检查服务状态
          echo "=== 服务状态检查 ==="
          echo "检查端口 3000:"
          nc -z localhost 3000 && echo "前端服务运行中" || echo "前端服务未响应"
          
          echo "检查端口 8000:"
          nc -z localhost 8000 && echo "后端服务运行中" || echo "后端服务未响应"
          
          # 如果任一服务未启动，显示日志并退出
          if ! nc -z localhost 3000 || ! nc -z localhost 8000; then
            echo "❌ 服务启动失败，显示日志:"
            echo "=== 后端日志 ==="
            cat logs/django.log || echo "无后端日志"
            echo "=== 前端日志 ==="
            cat logs/vue.log || echo "无前端日志"
            exit 1
          fi
          
          sleep 3
      
      - name: Run Cypress tests
        run: npx cypress run --headless --config baseUrl=http://localhost:3000
        working-directory: ./frontend
      
      # =============== 日志收集 ===============
      - name: Show backend logs if failed
        if: ${{ failure() }}
        run: cat logs/django.log
        
      - name: Show frontend logs if failed
        if: ${{ failure() }}
        run: cat logs/vue.log

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Vue dependencies
        run: |
          # 确保使用正确的包管理器（Vue 项目通常使用 npm 或 yarn）
          npm install --legacy-peer-deps
          
          # 如果是 Vue CLI 项目，确保 @vue/cli-service 已安装
          if ! grep -q "@vue/cli-service" package.json; then
            echo "Installing Vue CLI service..."
            npm install -g @vue/cli-service
          fi
          
          # 验证 Vue 相关依赖
          npm list vue @vue/cli-service || echo "Vue dependencies not found"
        working-directory: ./frontend

      - name: Run frontend unit tests
        run: |
          # Vue 项目的测试命令通常是 npm run test:unit 或 npm run test
          npm run test:unit || npm run test
        working-directory: ./frontend

  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    # 从 test-frontend 作业获取修复后的 lockfile
      - name: Download fixed lockfile
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

      - name: Update Dockerfile
        run: |
            sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:latest
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Dockerfile for Vue
        run: |
          # 确保 Dockerfile 适用于 Vue 项目
          # Vue 项目通常使用 nginx 作为生产服务器
          if [ ! -f "frontend/Dockerfile" ]; then
            echo "Creating Vue Dockerfile..."
            cat << EOF > frontend/Dockerfile
          FROM node:22-alpine as build-stage
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          RUN npm run build

          FROM nginx:1.27-alpine as production-stage
          COPY --from=build-stage /app/dist /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF
                  else
                    # 更新现有的 Dockerfile
                    sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/Dockerfile
                    # 确保使用 Vue 的构建命令
                    sed -i 's/npm run build:skip-check/npm run build/' frontend/Dockerfile
                  fi
        working-directory: ./

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@极速v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:latest
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}

  notify-deployment-ready:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao, gui-test-cypress, build-and-push-backend, build-and-push-frontend] 
    steps:
      - name: Notify Team
        run: |
          echo "CI/CD 流水线成功完成！"
          echo "所有测试（单元、API、GUI）均已通过！"
          echo "所有Docker镜像已推送至 GitHub Container Registry。"
          echo "请成员C在本地执行以下命令进行部署："
          echo "kubectl apply -f k8s-manifests/"

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: [build-and-push-frontend, build-and-push-backend]  # 应该依赖于构建作业，而不是通知作业
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check Kubernetes status
        run: |
          # 检查 Kubernetes 是否运行
          kubectl cluster-info
          kubectl get nodes
          
      - name: Validate and set up kubeconfig
        run: |
          # 检查KUBE_CONFIG secret是否存在且有效
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG secret is empty or not set"
            exit 1
          fi
          
          # 解码并保存kubeconfig
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          
          # 验证kubeconfig格式
          if ! kubectl --kubeconfig=kubeconfig.yaml config view; then
            echo "Invalid kubeconfig format"
            exit 1
          fi
          
          # 设置KUBECONFIG环境变量供后续步骤使用
          echo "KUBECONFIG=${PWD}/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Configure registry secret
        run: |
          kubectl --kubeconfig=$KUBECONFIG create secret docker-registry ghcr-token \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl --kubeconfig=$KUBECONFIG apply -f -
          
      - name: Deploy MySQL 
        run: kubectl --kubeconfig=$KUBECONFIG apply -f k8s-manifests/mysql-deployment.yaml

      - name: Deploy Backend
        run: kubectl --kubeconfig=$KUBECONFIG apply -f k8s-manifests/backend-deployment.yaml

      - name: Deploy Frontend
        run: kubectl --kubeconfig=$KUBECONFIG apply -f k8s-manifests/frontend-deploy.yaml
        
      - name: Verify Deployment
        run: |
          kubectl --kubeconfig=$KUBECONFIG get pods -o wide
          kubectl --kubeconfig=$KUBECONFIG get svc
          kubectl --kubeconfig=$KUBECONFIG get deployments
          
      - name: Wait for pods to be ready
        run: |
          # 等待所有pod变为就绪状态
          kubectl --kubeconfig=$KUBECONFIG wait --for=condition=ready pod --all --timeout=300s

  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Test KUBE_CONFIG
        run: |
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > test-config
            kubectl --kubeconfig=test-config get nodes
            
      - name: Test GHCR_PAT
        run: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin