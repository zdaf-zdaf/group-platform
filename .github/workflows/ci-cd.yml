name: group-pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ================ 检测变更的微服务 ================
  detect-changed-services:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 识别变更的微服务
        id: changed
        run: |
          # 调试：显示所有变更的文件
          echo "=== 所有变更文件 ==="
          git diff --name-only HEAD^ HEAD || echo "无法获取差异"
          
          # 检测backend目录下变更的微服务
          changed_dirs=$(git diff --name-only HEAD^ HEAD | grep -o '^backend/[^/]*' | sort | uniq)
          
          # 调试：显示检测到的服务
          echo "=== 检测到的服务变更 ==="
          echo "$changed_dirs"
          
          # 如果没有变更，默认构建所有服务（用于测试）
          if [ -z "$changed_dirs" ]; then
            changed_dirs="backend/forum backend/materials backend/notice backend/experiments backend/user"
            echo "=== 无变更，构建所有服务 ==="
          fi
          
          # 转换为简单格式（去掉backend/前缀）
          simple_dirs=$(echo "$changed_dirs" | sed 's|backend/||g')
          echo "changed_services=$simple_dirs" >> $GITHUB_OUTPUT
          echo "=== 最终输出 ==="
          echo "$simple_dirs"
  
  # ================ 论坛微服务单元测试 ================
  test-forum-service:
    runs-on: ubuntu-latest
    needs: detect-changed-services
    if: ${{ always() }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db_forum
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 等待MySQL就绪
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
              echo "MySQL已就绪"; break
            fi
            echo "等待MySQL...($i/30)"; sleep 2
          done
          # 配置远程访问
          mysql -h"127.0.0.1" -uroot -prootpassword -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpassword';
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpassword';
            FLUSH PRIVILEGES;"
            
      - name: 构建论坛微服务镜像
        run: docker build -t forum-service:test ./backend/forum-service
        
      - name: 运行论坛微服务容器
        run: |
          docker run -d --name forum-service-test \
            -p 8001:8000 \
            -e DJANGO_SETTINGS_MODULE=forum_service.settings \
            -e DB_ENGINE=django.db.backends.mysql \
            -e DB_NAME=test_db_forum \
            -e DB_USER=root \
            -e DB_PASSWORD=rootpassword \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DEBUG=True \
            forum-service:test
            
      - name: 等待服务启动
        run: sleep 10

      - name: 检查容器状态和日志
        run: |
          echo "=== 1. 列出所有容器（包括已退出的）==="
          docker ps -a

          echo "=== 2. 查看论坛服务容器的详细日志 ==="
          docker logs forum-service-test || echo "无法获取日志，容器可能不存在或从未启动"

          echo "=== 3. 检查容器的退出状态码 ==="
          docker inspect forum-service-test --format='{{.State.ExitCode}}' || echo "无法检查容器状态"

          echo "=== 4. 等待5秒后再次确认状态 ==="
          sleep 5
          docker ps -a | grep "forum-service-test" || echo "容器已消失"

      - name: 重置迁移历史
        run: |
          # 删除所有迁移文件
          docker exec forum-service-test bash -c 'rm forum/migrations/0*.py'
          
          # 创建新的初始迁移
          docker exec forum-service-test python manage.py makemigrations forum
          
          # 应用迁移
          docker exec forum-service-test python manage.py migrate
        
      - name: 运行数据库迁移
        run: |
          docker exec forum-service-test python manage.py makemigrations forum
          docker exec forum-service-test python manage.py migrate
        
      - name: 运行单元测试
        run: docker exec forum-service-test python manage.py test --verbosity=2

