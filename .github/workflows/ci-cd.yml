  # ================ 前端镜像构建 ================
  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

        # 确保下载修复后的依赖文件
      - name: Download fixed dependencies
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend
      - name: Update Dockerfile
        run: |
          # 仅更新Node版本
          sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile
          
          # 添加--legacy-peer-deps参数
          sed -i 's/npm install/npm install --legacy-peer-deps/' frontend/dockerfile
          
          # 添加vue-cli-service安装
          sed -i '/npm install --legacy-peer-deps/a RUN npm install -g @vue/cli-service' frontend/dockerfile
          
          # 添加调试命令
          sed -i '/COPY \. \./a RUN npm ls --depth=0' frontend/dockerfile
          
          # 打印验证
          cat frontend/dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:latest
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}

  # 并行论坛api测试
  api-test-luntan:
    name: Forum API Tests
    runs-on: ubuntu-latest
    needs: [build-forum-service]
    
    services:
      mysql-luntan:  # 服务名称唯一
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_luntan  # 独立的数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3307:3306  # 使用不同端口映射

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3307）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3307 -uroot -prootpassword --silent; then
                echo "MySQL for Luntan is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
    #  新增：执行数据库迁移
      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_luntan
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DEBUG: False

      - name: Start Django Server (Port 8001)
        run: |
            python manage.py runserver 127.0.0.1:8001 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_luntan  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3307  # 使用3307端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Forum Tests
        run: |
            newman run postman/collection1-LunTan.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8001/api" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8001" || true

