  # ================== 前端单元测试 ==================
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

        # 修复依赖步骤
      - name: Repair and install dependencies
        run: |
            # 确保使用正确的 npm 版本
            npm install -g npm@11.5.2
            
            # 完全重新生成 lockfile
            rm -rf node_modules
            rm -f package-lock.json
            
            # 安装依赖并生成新的 lockfile
            npm install --package-lock-only
            
            # 完整安装依赖
            npm install
            
            # 验证依赖是否同步
            npm ls --package-lock-only

      - name: Run frontend unit tests
        run: npm run test:unit  # 确保package.json中有test:unit脚本

      - name: Save fixed dependencies
        uses: actions/upload-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend/package*.json
            retention-days: 1

      - name: Run frontend unit tests
        run: npm run test:unit

  # ================ 论坛镜像构建 ================
  build-forum-service:
    runs-on: ubuntu-latest
    needs: [detect-changed-services, test-forum-service]
    # 仅当forum-service有变更时运行
    if: ${{ contains(fromJson(needs.detect-changed-services.outputs.changed-services), 'backend/forum-service') }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 登录GitHub容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # 需要提前在仓库Secrets中配置
          
      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend/forum-service  # 关键：指向微服务目录
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forum-service:latest
            ghcr.io/${{ github.repository_owner }}/forum-service:${{ github.sha }}

  # ================ 资料镜像构建 ================
