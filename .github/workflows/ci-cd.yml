  # ================== 生成部署脚本 ==================      
  generate-deployment-script:
    name: 生成部署脚本
    runs-on: ubuntu-latest
    # 依赖所有微服务和前端
    needs: 
      - build-experiment-service
      - build-forum-service
      - build-materials-service
      - build-notice-service
      - build-user-service
      - build-and-push-frontend
      
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成部署脚本
        run: |
          cat > deploy-to-local.sh << 'EOF'
          #!/bin/bash
          echo "=== 开始部署微服务到本地K8s ==="
          
          # 1. 更新所有微服务镜像版本
          sed -i "s|image:.*experiment_service:[^ ]*|image: ghcr.io/${{ github.repository_owner }}/experiment_service:${{ github.sha }}|g" backend/experiment_service/k8s/deployment.yaml
          sed -i "s|image:.*forum_service:[^ ]*|image: ghcr.io/${{ github.repository_owner }}/forum_service:${{ github.sha }}|g" backend/forum_service/k8s/deployment.yaml
          sed -i "s|image:.*materials_service:[^ ]*|image: ghcr.io/${{ github.repository_owner }}/materials_service:${{ github.sha }}|g" backend/materials_service/k8s/deployment.yaml
          sed -i "s|image:.*notice_service:[^ ]*|image: ghcr.io/${{ github.repository_owner }}/notice_service:${{ github.sha }}|g" backend/notice_service/k8s/deployment.yaml
          sed -i "s|image:.*user_service:[^ ]*|image: ghcr.io/${{ github.repository_owner }}/user_service:${{ github.sha }}|g" backend/user_service/k8s/deployment.yaml
          
          # 2. 更新前端镜像
          sed -i "s|image:.*frontend:.*|image: ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}|g" k8s/frontend-deploy.yaml
          
          # 3. 应用K8s配置
          echo "应用实验微服务配置..."
          kubectl apply -f backend/experiment_service/k8s/
          echo "应用论坛微服务配置..."
          kubectl apply -f backend/forum_service/k8s/
          echo "应用资料微服务配置..."
          kubectl apply -f backend/materials_service/k8s/
          echo "应用通知微服务配置..."
          kubectl apply -f backend/notice_service/k8s/
          echo "应用用户微服务配置..."
          kubectl apply -f backend/user_service/k8s/
          echo "应用前端配置..."
          kubectl apply -f k8s/frontend-deploy.yaml
          
          # 4. 等待服务就绪
          echo "等待服务启动(约60秒)..."
          sleep 60
          
          # 5. 显示访问信息
          echo "=== 部署完成 ==="
          echo "前端访问: http://localhost:30080"
          echo "API文档: http://localhost:30080/api/docs"
          EOF
          
          chmod +x deploy-to-local.sh
          echo "已生成部署脚本: deploy-to-local.sh"

      - name: 打包部署文件
        uses: actions/upload-artifact@v4
        with:
          name: microservices-deployment
          path: |
            backend/*/k8s/*.yaml  # 包含所有微服务的K8s配置
            k8s/frontend-deploy.yaml
            deploy-to-local.sh
          retention-days: 7

  deploy:
    name: 部署到 Kubernetes
    runs-on: ubuntu-latest
    needs: [build-forum-service, build-notice-service, build-materials-service, build-experiments-service, build-user-service, build-frontend]
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.32.2'   # 你本地集群的 kubectl 版本，可改

      - name: 设置 kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: 应用 Kubernetes 部署文件
        run: |
          kubectl apply -f k8s/

  migrate:
    name: 数据库迁移
    runs-on: ubuntu-latest
    needs: deploy   # 等 deploy 完成后再执行
    steps:
      - name: 安装 kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.32.2'

      - name: 设置 kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: 等待 Pod 启动
        run: |
          # 确保所有服务的 Pod 都已 ready
          kubectl rollout status deployment/forum
          kubectl rollout status deployment/notice
          kubectl rollout status deployment/user
          kubectl rollout status deployment/materials
          kubectl rollout status deployment/experiments

      - name: 执行数据库迁移
        run: |
          # 对每个服务执行 migrate
          for svc in forum notice user materials experiments
          do
            POD_NAME=$(kubectl get pod -l app=$svc -o jsonpath="{.items[0].metadata.name}")
            echo "正在为 $svc 执行 migrate ..."
            kubectl exec $POD_NAME -- python manage.py migrate --noinput
          done
          echo "所有服务的数据库迁移已完成！"
  
  
