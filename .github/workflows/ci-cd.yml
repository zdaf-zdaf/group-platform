name: group-pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ================ 检测变更的微服务 ================
  detect-changed-services:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史
          
      - name: 识别变更的微服务
        id: changed
        run: |
          # 识别backend目录下有变更的子目录（微服务）
          changed_dirs=$(git diff --name-only HEAD^ HEAD | grep -o '^backend/[^/]*' | sort | uniq)
          # 如果没有变更，默认构建所有服务
          if [ -z "$changed_dirs" ]; then
            changed_dirs="backend/experiments-service backend/forum-service backend/materials-service backend/notice-service backend/user-service"
          fi
          # 转换为JSON数组格式
          json_list=$(echo $changed_dirs | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "changed_services=$json_list" >> $GITHUB_OUTPUT
  
  # ================ 论坛微服务单元测试 ================
  test-forum-service:
    runs-on: ubuntu-latest
    needs: detect-changed-services
    # 仅当forum-service有变更时运行
    if: ${{ contains(fromJson(needs.detect-changed-services.outputs.changed-services), 'backend/forum-service') }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db_forum  # 服务专属数据库
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 等待MySQL就绪
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -prootpassword --silent; then
              echo "MySQL已就绪"; break
            fi
            echo "等待MySQL...($i/30)"; sleep 2
          done
          # 配置远程访问
          mysql -h"127.0.0.1" -uroot -prootpassword -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpassword';
            FLUSH PRIVILEGES;"
            
      - name: 构建论坛微服务镜像
        run: docker build -t forum-service:test ./backend/forum-service
        
      - name: 运行论坛微服务容器
        run: |
          docker run -d --name forum-service \
            -e DB_ENGINE=django.db.backends.mysql \
            -e DB_NAME=test_db_forum \
            -e DB_USER=root \
            -e DB_PASSWORD=rootpassword \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DEBUG=False \
            forum-service:test
            
      - name: 执行数据库迁移
        run: docker exec forum-service python manage.py migrate --noinput
        
      - name: 运行单元测试
        run: docker exec forum-service python manage.py test --verbosity=2

  # ================ 资料微服务单元测试 ================
