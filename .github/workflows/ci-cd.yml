  # ================ 论坛镜像构建 ================
  build-forum-service:
    runs-on: ubuntu-latest
    needs: [detect-changed-services, test-forum-service]
    # 仅当forum-service有变更时运行
    if: ${{ contains(fromJson(needs.detect-changed-services.outputs.changed-services), 'backend/forum-service') }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 登录GitHub容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # 需要提前在仓库Secrets中配置
          
      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
