            done
      - name: Start Django Server (Port 8004)
        run: |
            python manage.py runserver 0.0.0.0:8004 &
            sleep 5
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_ziliao  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3310  # 使用3310端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Learning Materials Tests
        run: |
            newman run postman/collection4-ziliao.json \
            --environment postman/materials_environment.json \
            --env-var "baseUrl=http://127.0.0.1:8004" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8004" || true
  gui-test-cypress:
    name: Run Cypress GUI Tests
    runs-on: ubuntu-latest
    needs: [test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao]

    services:
      mysql-gui:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db_gui
          MYSQL_ROOT_HOST: '%'
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - run: npm install
        working-directory: ./frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt
        working-directory: ./backend

      - run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -prootpassword --silent; then break; fi
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -prootpassword -e "
          CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'rootpassword';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;"
        
      - run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_gui
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DEBUG: False

      - run: |
          mkdir -p logs
          python manage.py runserver 0.0.0.0:8000 --insecure --settings=server.test_settings > ../logs/django.log 2>&1 &
          echo $! > ../logs/django.pid
        working-directory: ./backend

      - run: |
          echo "VUE_APP_API_BASE_URL=http://127.0.0.1:8000" > .env
          echo "VUE_APP_DEBUG=true" >> .env
          npm run dev -- --host 0.0.0.0 --port 8080 > ../logs/vue.log 2>&1 &
          echo $! > ../logs/vue.pid
        working-directory: ./frontend

      - run: |
          npm install -g wait-on
          wait-on http://127.0.0.1:8080 http://localhost:8080 http://127.0.0.1:8000

      - run: |
          # 注册并登录账号，统一获取 token
          python3 ./scripts/setup_test_accounts.py
        working-directory: ./frontend

      - run: npx cypress run --headless --config baseUrl=http://127.0.0.1:8080
        working-directory: ./frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: logs/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'



        # 修复依赖步骤
      - name: Repair and install dependencies
        run: |
            # 确保使用正确的 npm 版本
            npm install -g npm@11.5.2
            
            # 完全重新生成 lockfile
            rm -rf node_modules
            rm -f package-lock.json
            
            # 安装依赖并生成新的 lockfile
            npm install --package-lock-only
            
            # 完整安装依赖
            npm install
            
            # 验证依赖是否同步
            npm ls --package-lock-only
      
      - name: Check Node.js version
        run: node -v && npm -v
        working-directory: ./frontend

      - name: Fix esbuild binary permissions
        run: chmod +x ./frontend/node_modules/esbuild/bin/esbuild || true
        working-directory: ./frontend

      - name: Debug artifact upload before
        run: ls -lh ./frontend && ls -lh ./frontend/node_modules || true

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Debug artifact upload after
        run: echo "Artifact upload step已执行" && ls -lh ./frontend && ls -lh ./frontend/node_modules || true

      - name: Save fixed dependencies
        uses: actions/upload-artifact@v4
        with:
            name: frontend-dependencies
            path: |
              ./frontend/package*.json
            retention-days: 1

  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    # 从 test-frontend 作业获取修复后的 lockfile
      - name: Download fixed lockfile
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

      - name: Update Dockerfile
        run: |
            sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:latest
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

        # 确保下载修复后的依赖文件
      - name: Download fixed dependencies
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./frontend

      - name: Fix esbuild binary permissions
        run: chmod +x ./frontend/node_modules/esbuild/bin/esbuild || true
        working-directory: ./frontend

      - name: Check Node.js version
        run: node -v && npm -v
        working-directory: ./frontend


      - name: Update Dockerfile
        run: |
          # 仅更新Node版本
          sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile
          
          # 添加--legacy-peer-deps参数
          sed -i 's/npm install/npm install --legacy-peer-deps/' frontend/dockerfile
          
          # 添加vue-cli-service安装
          sed -i '/npm install --legacy-peer-deps/a RUN npm install -g @vue/cli-service' frontend/dockerfile
          
          # 添加调试命令
          sed -i '/COPY \. \./a RUN npm ls --depth=0' frontend/dockerfile
          
          # 打印验证
          cat frontend/dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:latest
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}

  generate-deployment-script:
    name: Generate Deployment Script
    runs-on: ubuntu-latest
    # 依赖所有测试和构建作业
    needs: [test-backend, test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao, gui-test-cypress, build-and-push-backend, build-and-push-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 生成部署脚本
      - name: Generate Local Deployment Package
        run: |
          # 创建一键部署脚本
          cat > deploy-to-local.sh << 'EOF'
          #!/bin/bash
          echo "开始部署到本地K8s环境..."
          
          # 1. 更新镜像版本
          sed -i "s|image:.*backend:.*|image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image:.*frontend:.*|image: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}|g" k8s/frontend-deploy.yaml
          
          # 2. 部署到K8s
          kubectl apply -f k8s/
          
          # 3. 等待服务就绪
          echo "等待服务启动..."
          sleep 30
          
          # 4. 显示访问信息
          echo "部署完成！"
          echo "前端访问: http://127.0.0.1:30080"
          echo "后端API: http://127.0.0.1:30080/api"
          echo ""
          echo "运行集成测试:"
          echo "cd postman && newman run collection1-LunTan.json -e environment.json"
          EOF
          
          chmod +x deploy-to-local.sh
          echo "生成了一键部署脚本: deploy-to-local.sh"

      # 上传部署包
      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: local-deployment-package
          path: |
            k8s/
            deploy-to-local.sh
          retention-days: 7

  notify-deployment-ready:
    runs-on: ubuntu-latest
    # 依赖部署脚本生成作业
    needs: [generate-deployment-script] 
    steps:
      - name: Notify Team
        run: |
          echo "CI流程完成！"
          echo ""
          echo "请下载部署包并本地执行:"
          echo "1. 从Artifacts下载 'local-deployment-package'"
          echo "2. 解压后运行: chmod +x deploy-to-local.sh && ./deploy-to-local.sh"
          echo "3. 访问 http://127.0.0.1:30080 验证部署"
          echo ""
          echo "注意: 确保本地Docker Desktop和Kubectl已正确配置"