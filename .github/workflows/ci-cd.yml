  # ================ 论坛微服务单元测试 ================
  test-forum-service:
    runs-on: ubuntu-latest
    # needs: detect-changed-services
    if: ${{ always() }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db_forum
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建论坛微服务镜像
        run: docker build -t forum_service:test ./backend/forum_service

      - name: 查看本地镜像
        run: docker images

      - name: 找到 GitHub Actions 默认网络
        id: get-network
        run: |
          NETWORK_ID=$(docker network ls --format "{{.Name}}" | grep "github_network" || true)
          if [ -z "$NETWORK_ID" ]; then
            echo "未找到 github_network，列出所有网络："
            docker network ls
            exit 1
          fi
          echo "network=$NETWORK_ID" >> $GITHUB_OUTPUT

      - name: 等待 MySQL 在容器网络内可访问
        run: |
          for i in {1..30}; do
            if docker run --rm --network ${{ steps.get-network.outputs.network }} mysql:8.0 \
              mysql -hmysql -uroot -prootpassword -e "SELECT 1;" test_db_forum; then
              echo "MySQL 在容器内可访问"; break
            fi
            echo "等待 MySQL...($i/30)"; sleep 2
          done

      - name: 运行论坛服务容器
        run: |
          docker run -d --name forum_service_test \
            --network ${{ steps.get-network.outputs.network }} \
            -p 8001:8000 \
            -e DJANGO_SETTINGS_MODULE=forum_service.settings \
            -e DB_ENGINE=django.db.backends.mysql \
            -e DB_NAME=test_db_forum \
            -e DB_USER=root \
            -e DB_PASSWORD=rootpassword \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DEBUG=True \
            forum_service:test

      - name: 等待服务启动
        run: sleep 10

      - name: 检查容器状态和日志
        run: |
          echo "=== 容器列表 ==="
          docker ps -a
          echo "=== 容器日志 ==="
          docker logs forum_service_test || true
          echo "=== 容器退出状态码 ==="
          docker inspect forum_service_test --format='{{.State.ExitCode}}' || true

      - name: 运行单元测试
        run: docker exec forum_service_test python manage.py test --verbosity=2

