name: group-pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ================== 后端测试（容器化） ==================
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
          DEBUG: False

      - name: Start Django Server (Port 8002)
        run: |
            python manage.py runserver 127.0.0.1:8002 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_lab  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3308  # 使用3308端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Lab Tests
        run: |
            newman run postman/collection2-Lab.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8002/api" \
            --reporters cli
      - name: Display Server Logs on Failure
        if: failure()  
        run: |
            echo "===== Django Server Logs ====="
            cat backend/debug.log  # 假设服务器日志输出到backend/debug.log
            echo "===== End Logs ====="
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8002" || true
  # 并行公告测试（配置类似，但使用不同端口和数据库名）
  api-test-gonggao:
    name: Parallel Announcement Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    services:
      mysql-gonggao:
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_gonggao  # 独立数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3309:3306  # 不同端口

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3309）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3309 -uroot -prootpassword --silent; then
                echo "MySQL for GongGao is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
    # 新增：执行数据库迁移
      - name: Run migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_gonggao
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3309
          DEBUG: False

      - name: Start Django Server (Port 8003)
        run: |
            python manage.py runserver 127.0.0.1:8003 &
            sleep 5  # 等待服务器启动
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_gonggao  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3309  # 使用3309端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Announcement Tests
        run: |
            newman run postman/collection3-GongGao.json \
            --environment postman/environment.json \
            --env-var "baseUrl=http://127.0.0.1:8003/api" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8003" || true
    # 并行学习资料测试
  api-test-ziliao:
    name: Parallel Learning Materials Tests
    runs-on: ubuntu-latest
    needs: [test-backend] # 依赖后端单元测试
    
    services:
      mysql-ziliao:  # 服务名称唯一
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: test_db_ziliao  # 独立的数据库名
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
            - 3310:3306  # 使用新端口（3310）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
        
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: ./backend
        
      - name: Configure MySQL
        run: |
            sudo apt-get update && sudo apt-get install -y mysql-client
            # 等待MySQL启动（使用新端口3310）
            for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P 3310 -uroot -prootpassword --silent; then
                echo "MySQL for Learning Materials is ready!"
                break
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
            done
      - name: Start Django Server (Port 8004)
        run: |
            python manage.py runserver 0.0.0.0:8004 &
            sleep 5
        working-directory: ./backend
        env:
            DJANGO_SETTINGS_MODULE: server.settings
            DB_ENGINE: django.db.backends.mysql
            DB_NAME: test_db_ziliao  # 指定独立数据库
            DB_USER: root
            DB_PASSWORD: rootpassword
            DB_HOST: 127.0.0.1
            DB_PORT: 3310  # 使用3310端口
            DEBUG: False

      - name: Install Newman
        run: npm install -g newman

      - name: Run Learning Materials Tests
        run: |
            newman run postman/collection4-ziliao.json \
            --environment postman/materials_environment.json \
            --env-var "baseUrl=http://127.0.0.1:8004" \
            --reporters cli
      - name: Stop Django Server
        run: |
            pkill -f "runserver 0.0.0.0:8004" || true
  gui-test-cypress:
    name: Run Cypress GUI Tests
    runs-on: ubuntu-latest
    needs: [test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao]

    services:
      mysql-gui:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db_gui
          MYSQL_ROOT_HOST: '%'
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s

    steps:
      - uses: actions/checkout@v4

      # ================== Node.js 前端 ==================
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - run: npm install
        working-directory: ./frontend

      # ================== Python 后端 ==================
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt
        working-directory: ./backend

      # ================== MySQL 配置 ==================
      - run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -prootpassword --silent; then break; fi
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -prootpassword -e "
          CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'rootpassword';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;"

      # ================== Django 数据库迁移 ==================
      - name: 运行数据库迁移
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: server.test_settings
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: test_db_gui
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DEBUG: False

      - name: Install wait-on
        run: npm install -g wait-on
      # ================== 启动 Django 和 Vue ==================
      # 先在 backend 目录启动 Django
      - name: Start Django Server
        run: |
          python manage.py runserver 0.0.0.0:8000 --insecure --settings=server.test_settings &
          echo $! > django.pid
          if ! wait-on --timeout 180000 http://127.0.0.1:8000; then
            echo "❌ 服务启动失败，输出日志："
            exit 1
          fi
        working-directory: ./backend

      # 再在 frontend 目录启动 Vue 并检测端口
      - name: Start Vue Server
        run: |
          echo "VUE_APP_API_BASE_URL=http://127.0.0.1:8000" > .env
          echo "VUE_APP_DEBUG=true" >> .env
          npm run dev -- --host 0.0.0.0 --port 8080 &
          npm install -g wait-on
          if ! wait-on --timeout 180000 http://127.0.0.1:8080; then
            echo "❌ Vue 服务启动失败"
            exit 1
          fi
        env:
          VUE_APP_API_BASE_URL: http://127.0.0.1:8000
          VUE_APP_DEBUG: true
        working-directory: ./frontend

      # ================== 初始化测试账号 ==================
      - name: 新建前端日志文件夹
        run: mkdir -p logs
        working-directory: ./frontend
      - name: 新建后端日志文件夹
        run: mkdir -p logs
        working-directory: ./backend
        
      - name: 初始化测试账号
        run: |
          # 注册 stuTest
          echo "注册 stuTest："
          curl -s -X POST http://127.0.0.1:8000/api/auth/register/ \
            -H "Content-Type: application/json" \
            -d '{"username":"stuTest","email":"stuTest@example.com","password":"Test1234@","confirmPassword":"Test1234@","role":"student","agreedToTerms":true}' || echo "stuTest 已存在"

          # 注册 tchTest
          echo "注册 tchTest："
          curl -s -X POST http://127.0.0.1:8000/api/auth/register/ \
            -H "Content-Type: application/json" \
            -d '{"username":"tchTest","email":"tchTest@example.com","password":"Test1234@","confirmPassword":"Test1234@","role":"teacher","agreedToTerms":true}' || echo "tchTest 已存在"

          # stuTest 登录获取 token
          echo "stuTest 登录并获取 token："
          curl -s -X POST http://127.0.0.1:8000/api/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username":"stuTest","password":"Test1234@"}' > logs/stuToken.json

          STU_TOKEN=$(cat logs/stuToken.json | python3 -c "import sys, json; print(json.load(sys.stdin).get('access',''))")
          echo "stuTest TOKEN: $STU_TOKEN"

          # tchTest 登录获取 token
          echo "tchTest 登录并获取 token："
          curl -s -X POST http://127.0.0.1:8000/api/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username":"tchTest","password":"Test1234@"}' > logs/tchToken.json

          TCH_TOKEN=$(cat logs/tchToken.json | python3 -c "import sys, json; print(json.load(sys.stdin).get('access',''))")
          echo "tchTest TOKEN: $TCH_TOKEN"

          # 测试 API 是否可访问
          echo "检查 stuTest 用户信息："
          curl -s -H "Authorization: Bearer $STU_TOKEN" http://127.0.0.1:8000/api/auth/user/profile/

          echo "检查 tchTest 用户信息："
          curl -s -H "Authorization: Bearer $TCH_TOKEN" http://127.0.0.1:8000/api/auth/user/profile/
        working-directory: ./frontend
         

      # ================== 运行 Cypress ==================
      - name: Run Cypress GUI tests
        run: |
          set -o pipefail
          npx cypress run --headless --config baseUrl=http://127.0.0.1:8080 2>&1 | tee logs/cypress.log || (
            echo "❌ Cypress 测试失败，输出日志："
            cat logs/cypress.log

            echo "=== stuTest Token ==="
            [ -f logs/stuToken.json ] && cat logs/stuToken.json || echo "stuToken.json 不存在"

            echo "=== tchTest Token ==="
            [ -f logs/tchToken.json ] && cat logs/tchToken.json || echo "tchToken.json 不存在"

            echo "=== API 响应示例（stuTest） ==="
            [ -f logs/stuToken.json ] && \
              curl -s -H "Authorization: Bearer $(cat logs/stuToken.json | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"access\",\"\"))')" \
              http://127.0.0.1:8000/api/auth/user/profile/ || echo "无法调用 API：stuTest Token 不存在"

            echo "=== API 响应示例（tchTest） ==="
            [ -f logs/tchToken.json ] && \
              curl -s -H "Authorization: Bearer $(cat logs/tchToken.json | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"access\",\"\"))')" \
              http://127.0.0.1:8000/api/auth/user/profile/ || echo "无法调用 API：tchTest Token 不存在"

            exit 1
          )
        working-directory: ./frontend

      # ================== 上传 logs 和 Cypress artifact ==================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: logs/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'



        # 修复依赖步骤
      - name: Repair and install dependencies
        run: |
            # 确保使用正确的 npm 版本
            npm install -g npm@11.5.2
            
            # 完全重新生成 lockfile
            rm -rf node_modules
            rm -f package-lock.json
            
            # 安装依赖并生成新的 lockfile
            npm install --package-lock-only
            
            # 完整安装依赖
            npm install
            
            # 验证依赖是否同步
            npm ls --package-lock-only
      
      - name: Check Node.js version
        run: node -v && npm -v
        working-directory: ./frontend

      - name: Fix esbuild binary permissions
        run: chmod +x ./frontend/node_modules/esbuild/bin/esbuild || true
        working-directory: ./frontend

      - name: Debug artifact upload before
        run: ls -lh ./frontend && ls -lh ./frontend/node_modules || true

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Debug artifact upload after
        run: echo "Artifact upload step已执行" && ls -lh ./frontend && ls -lh ./frontend/node_modules || true

      - name: Save fixed dependencies
        uses: actions/upload-artifact@v4
        with:
            name: frontend-dependencies
            path: |
              ./frontend/package*.json
            retention-days: 1

  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    # 从 test-frontend 作业获取修复后的 lockfile
      - name: Download fixed lockfile
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

      - name: Update Dockerfile
        run: |
            sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:latest
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

        # 确保下载修复后的依赖文件
      - name: Download fixed dependencies
        uses: actions/download-artifact@v4
        with:
            name: frontend-dependencies
            path: ./frontend

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./frontend

      - name: Fix esbuild binary permissions
        run: chmod +x ./frontend/node_modules/esbuild/bin/esbuild || true
        working-directory: ./frontend

      - name: Check Node.js version
        run: node -v && npm -v
        working-directory: ./frontend


      - name: Update Dockerfile
        run: |
          # 仅更新Node版本
          sed -i 's/FROM node:20-alpine/FROM node:22-alpine/' frontend/dockerfile
          
          # 添加--legacy-peer-deps参数
          sed -i 's/npm install/npm install --legacy-peer-deps/' frontend/dockerfile
          
          # 添加vue-cli-service安装
          sed -i '/npm install --legacy-peer-deps/a RUN npm install -g @vue/cli-service' frontend/dockerfile
          
          # 添加调试命令
          sed -i '/COPY \. \./a RUN npm ls --depth=0' frontend/dockerfile
          
          # 打印验证
          cat frontend/dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:latest
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}


  deploy-to-k8s:
    name: Deploy to K8S in CI
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, api-test-luntan, api-test-lab, api-test-gonggao, api-test-ziliao, gui-test-cypress, build-and-push-backend, build-and-push-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 安装 kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: 创建K8S集群
        run: kind create cluster --name ci-cluster

      - name: 配置kubectl
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: 替换K8S镜像标签
        run: |
          sed -i "s|image:.*backend:.*|image: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image:.*frontend:.*|image: ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}|g" k8s/frontend-deploy.yaml

      - name: 加载后端镜像到kind
        run: kind load docker-image ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }} --name ci-cluster

      - name: 加载前端镜像到kind
        run: kind load docker-image ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }} --name ci-cluster

      - name: 部署到K8S
        run: kubectl apply -f k8s/

      - name: 等待服务启动
        run: sleep 30

      - name: 运行后端API集成测试
        run: |
          newman run postman/collection1-LunTan.json -e postman/environment.json --env-var "baseUrl=http://localhost:30080/api"

      - name: 运行前端GUI集成测试
        run: |
          npx cypress run --headless --config baseUrl=http://localhost:30080

      - name: 删除K8S集群
        if: always()
        run: kind delete cluster --name ci-cluster

