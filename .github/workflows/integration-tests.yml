name: Integration Tests

on:
  workflow_run:
    workflows: 
      - "User Service CI/CD"
      - "Notice Service CI/CD"
      - "Materials Service CI/CD"
      - "Forum Service CI/CD"
      - "Lab Service CI/CD"
    types:
      - completed

jobs:
  run-integration-tests:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'User Service CI/CD' ||
       github.event.workflow_run.name == 'Notice Service CI/CD' ||
       github.event.workflow_run.name == 'Materials Service CI/CD' ||
       github.event.workflow_run.name == 'Forum Service CI/CD' ||
       github.event.workflow_run.name == 'Lab Service CI/CD')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all deployment scripts
        uses: actions/download-artifact@v4
        with:
          pattern: *-deployment
          path: deployment-scripts
          
      - name: Make scripts executable
        run: chmod +x deployment-scripts/*.sh
        
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
          
      - name: Configure K8s context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          
      - name: Deploy shared resources
        run: kubectl apply -f k8s/
        
      - name: Deploy all microservices
        run: |
          # 按顺序部署所有服务
          for script in deployment-scripts/*.sh; do
            echo "Executing $script"
            ./$script
            sleep 10 # 等待服务启动
          done
          
      - name: Wait for services to be ready
        run: |
          # 检查所有服务是否就绪
          kubectl wait --for=condition=available --timeout=300s deployment/user-service
          kubectl wait --for=condition=available --timeout=300s deployment/notice-service
          kubectl wait --for=condition=available --timeout=300s deployment/materials-service
          kubectl wait --for=condition=available --timeout=300s deployment/forum-service
          kubectl wait --for=condition=available --timeout=300s deployment/lab-service
          
      - name: Run Postman collections
        run: |
          npm install -g newman
          
          # 运行所有Postman集合
          newman run postman/collection1-LunTan.json -e postman/environment.json
          newman run postman/collection2-Lab.json -e postman/environment.json
          newman run postman/collection3-GongGao.json -e postman/environment.json
          newman run postman/collection4-ziliao.json -e postman/materials_environment.json
          
      - name: Run load tests
        run: |
          # 安装k6
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747EF3415AC364EE36C76E1C9C7D1EF62
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
          
          # 运行负载测试
          k6 run --vus 100 --duration 1m scripts/load-test.jsname: Integration Tests

