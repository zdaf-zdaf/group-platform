version: '3.8'

services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: group_platform
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  # 用户服务
  user-service:
    build: ./user-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: group_platform
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "8001:8001"

  # 公告服务
  notice-service:
    build: ./notice-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: group_platform
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "8000:8000"

  # 学习资料服务
  materials-service:
    build: ./materials-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: group_platform
      DB_USER: user
      DB_PASSWORD: password
    volumes:
      - media_data:/app/media
    ports:
      - "8002:8002"

volumes:
  mysql_data:
  media_data: