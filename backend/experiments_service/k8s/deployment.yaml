apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiments-service
  labels:
    app: experiments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: experiments-service
  template:
    metadata:
      labels:
        app: experiments-service
    spec:
      containers:
      - name: experiments-service
        image: experiments-service:latest  # 请替换为实际镜像地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "experiments_service.settings.production"
        # 数据库连接配置
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10