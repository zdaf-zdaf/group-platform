apiVersion: apps/v1
kind: Deployment
metadata:
  name: materials-service
  labels:
    app: materials-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: materials-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: materials-service
    spec:
      # 添加初始化容器处理数据库迁移
      initContainers:
        - name: db-migration
          image: yourrepo/materials-service:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: server.settings
            - name: DB_ENGINE
              value: django.db.backends.mysql
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret  # 使用专属secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret
                  key: MYSQL_PASSWORD
            - name: DB_HOST
              value: materials-mysql-service  # 指向专属数据库服务
            - name: DB_PORT
              value: "3306"
      
      containers:
        - name: materials-service
          image: yourrepo/materials-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: server.settings
            - name: DEBUG
              value: "false"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: TIME_ZONE
              value: Asia/Shanghai
            - name: DB_ENGINE
              value: django.db.backends.mysql
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret  # 专属secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: materials-mysql-secret
                  key: MYSQL_PASSWORD
            - name: DB_HOST
              value: materials-mysql-service  # 专属数据库服务
            - name: DB_PORT
              value: "3306"
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "true"
            # 添加其他服务访问URL
            - name: USER_SERVICE_URL
              value: "http://user-service:8000"
            - name: NOTICE_SERVICE_URL
              value: "http://notice-service:8000"
          
          # 添加资源请求和限制
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          readinessProbe:
            httpGet:
              path: /health/  # 确保此端点存在
              port: 8000
            initialDelaySeconds: 15  # 给应用更多启动时间
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /health/  # 确保此端点存在
              port: 8000
            initialDelaySeconds: 30  # 比readiness更长
            periodSeconds: 15
            failureThreshold: 3
          
          volumeMounts:
            - name: media
              mountPath: /app/media
            # 添加配置映射挂载（如果需要）
            - name: config-volume
              mountPath: /app/config
      
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: materials-media-pvc
        - name: config-volume
          configMap:
            name: materials-config

---
apiVersion: v1
kind: Service
metadata:
  name: materials-service
  labels:
    app: materials-service
spec:
  selector:
    app: materials-service
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000