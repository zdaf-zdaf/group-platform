apiVersion: apps/v1
kind: Deployment
metadata:
  name: materials-service
  labels:
    app: materials-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: materials-service
  template:
    metadata:
      labels:
        app: materials-service
    spec:
      containers:
      - name: materials-service
        image: materials-service:latest  # 请替换为实际镜像地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONPATH
          value: "/backend/materials_service"
        - name: DJANGO_SETTINGS_MODULE
          value: "server.settings"
        # 数据库连接配置
        - name: DB_HOST
          value: "mysql"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE_MATERIALS
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER_MATERIALS
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD_MATERIALS
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe: null