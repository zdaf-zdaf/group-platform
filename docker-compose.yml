version: '3.8'

services:
  # 网关服务
  gateway:
    image: nginx:latest
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx
    ports:
      - "8088:80"
    depends_on:
      frontend:
        condition: service_healthy
      user_service:
        condition: service_started
      materials_service:
        condition: service_started
      notice_service:
        condition: service_started
      forum_service:
        condition: service_started
    restart: always
  # 用户微服务
  user_service:
    build:
      context: ./backend/user_service
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/user_service:/app
    environment:
      - DB_HOST=user_db 
      - DB_NAME=user_db_name
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw-123
      - SECRET_KEY=django-insecure-9ekm#x74ns6(j*h)3+jb-v*sz7bho2edo%g)uktin)ugf-5!s%
    depends_on:
      - user_db
    restart: always

  # 学习资料微服务
  materials_service:
    build:
      context: ./backend/materials_service
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./backend/materials_service:/app
      - materials_media:/app/media
    environment:
      - DB_HOST=materials_db
      - DB_NAME=materials_db_name
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw-123
      - SECRET_KEY=django-insecure-9ekm#x74ns6(j*h)3+jb-v*sz7bho2edo%g)uktin)ugf-5!s%
    depends_on:
      - materials_db 
    restart: always

  # 公告微服务
  notice_service:
    build:
      context: ./backend/notice-service
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations notice &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"
    volumes:
      - ./backend/notice-service:/app
    environment:
      - DB_HOST=notice_db
      - DB_NAME=notice_db_name
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw-123
      - SECRET_KEY=django-insecure-9ekm#x74ns6(j*h)3+jb-v*sz7bho2edo%g)uktin)ugf-5!s%
    depends_on:
      notice_db: # 关键修改
        condition: service_healthy # 等待数据库健康检查通过
    restart: always

  # 论坛微服务
  forum_service:
    build:
      context: ./backend/forum-service
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations forum &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8003"
    volumes:
      - ./backend/forum-service:/app
    environment:
      - DB_HOST=forum_db
      - DB_NAME=forum_db_name
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw-123
      - SECRET_KEY=django-insecure-9ekm#x74ns6(j*h)3+jb-v*sz7bho2edo%g)uktin)ugf-5!s%
    depends_on:
      forum_db:
        condition: service_healthy
    restart: always

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 确保后端服务启动后再启动前端，以便代理能正常工作
    depends_on:
      - user_service
      - materials_service
      - notice_service
      - forum_service
    restart: always

  # 用户服务的数据库
  user_db:
    image: mysql:8.0
    container_name: user_db
    volumes:
      - user_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw-123
      MYSQL_DATABASE: user_db_name
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 资料服务的数据库
  materials_db:
    image: mysql:8.0
    container_name: materials_db
    volumes:
      - materials_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw-123
      MYSQL_DATABASE: materials_db_name
    ports:
      - "3308:3306" # 映射到主机的3308端口，避免冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 公告服务的数据库
  notice_db:
    image: mysql:8.0
    container_name: notice_db
    volumes:
      - notice_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw-123
      MYSQL_DATABASE: notice_db_name
    ports:
      - "3309:3306" # 映射到主机的3309端口
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 论坛服务的数据库
  forum_db:
    image: mysql:8.0
    container_name: forum_db
    volumes:
      - forum_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw-123
      MYSQL_DATABASE: forum_db_name
    ports:
      - "3310:3306" # 映射到主机的3310端口
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  user_mysql_data:
  materials_mysql_data:
  materials_media:
  notice_mysql_data:
  forum_mysql_data: