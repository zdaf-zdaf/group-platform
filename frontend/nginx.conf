# frontend/nginx.conf

server {
    listen 80;
    server_name localhost;

    # Web根目录，指向我们从构建阶段复制过来的文件
    root /usr/share/nginx/html;
    index index.html;

    # 关键配置：处理所有location
    # 尝试直接查找文件，如果找不到，则回退到 index.html
    # 这使得Vue Router能够接管路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可以选择性地为静态资源添加缓存头，以优化性能
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}