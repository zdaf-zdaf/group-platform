server {
    listen 80;
    client_max_body_size 500M; # 新增：允许最大上传500MB的文件
    # 指定 Docker 的 DNS 解析器
    resolver 127.0.0.11; 
    server_name localhost;
    # 开启最详细的访问和错误日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    # 转发到前端服务
    location / {
        # 使用变量，让 Nginx 在运行时解析地址
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 转发到后端认证服务
    location ~ ^/api/auth {
        # 使用变量，让 Nginx 在运行时解析地址
        set $upstream_userservice http://user_service:8000;
        proxy_pass $upstream_userservice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 转发到后端用户服务
    location ~ ^/api/user {
        # 使用变量，让 Nginx 在运行时解析地址
        set $upstream_userservice http://user_service:8000;
        proxy_pass $upstream_userservice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 转发到资料服务
    location ~ ^/materials {
        # 使用变量，让 Nginx 在运行时解析地址
        set $upstream_materialsservice http://materials_service:8001;
        proxy_pass $upstream_materialsservice;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 转发到资料服务的媒体文件路径
    location ~ ^/media/materials {
        # 使用变量，让 Nginx 在运行时解析地址
        set $upstream_materialsservice http://materials_service:8001;
        proxy_pass $upstream_materialsservice;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 新增：代理对媒体文件的请求到 materials_service
    location /media/ {
        proxy_pass http://materials_service:8001; # Django media files
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 转发到公告服务
    location ~ ^/api/notices {
        set $upstream_noticeservice http://notice_service:8002;
        proxy_pass $upstream_noticeservice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}