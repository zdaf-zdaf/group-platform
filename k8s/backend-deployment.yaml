apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-backend
  labels:
    app: course-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-backend
  template:
    metadata:
      labels:
        app: course-backend
    spec:
      containers:
        - name: backend
          image: course-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "server.settings"
            - name: DB_ENGINE
              value: "django.db.backends.mysql"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      initContainers:
      - name: db-migration
        image: course-backend:latest
        imagePullPolicy: Never
        command: 
        - bash 
        - -c
        - |
          # 使用 Python 检测 MySQL 端口
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if python -c "
          import socket
          import sys
          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(2)
              result = sock.connect_ex(('mysql', 3306))
              sock.close()
              sys.exit(result)
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)
                  "; then
                    echo "MySQL is ready!"
                    break
                  else
                    echo "MySQL not ready yet (attempt $i/30)..."
                    if [ $i -eq 30 ]; then
                      echo "ERROR: MySQL not ready after 30 attempts"
                      exit 1
                    fi
                    sleep 2
                  fi
                done
                
                # MySQL 就绪后执行迁移
                echo "Running database migrations..."
                python manage.py migrate --noinput
                echo "Collecting static files..."
                python manage.py collectstatic --noinput
                echo "Database initialization completed successfully!"
        env:
          # 你的环境变量配置保持不变
          - name: DJANGO_SETTINGS_MODULE
            value: "server.settings"
          - name: DB_ENGINE
            value: "django.db.backends.mysql"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_DATABASE
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_PASSWORD
          - name: DB_HOST
            value: "mysql"
          - name: DB_PORT
            value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: course-backend
  labels:
    app: course-backend
spec:
  selector:
    app: course-backend
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000