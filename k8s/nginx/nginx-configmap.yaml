apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
        listen 80;
        client_max_body_size 500M;
        
        # 使用正确的DNS服务器
        resolver 10.96.0.10 valid=10s;
        
        server_name localhost;
        
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;
        
        # 关键修复：使用完全限定域名（FQDN）
        set $frontend "http://frontend-service.default.svc.cluster.local:80";
        set $user_service "http://user-service.default.svc.cluster.local:80";
        set $materials_service "http://materials-service.default.svc.cluster.local:80";
        set $forum_service "http://forum-service.default.svc.cluster.local:80";
        set $notice_service "http://notice-service.default.svc.cluster.local:80";

        # 转发到前端服务
        location / {
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发到后端认证服务
        location ~ ^/api/auth {
            proxy_pass $user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其他location配置保持不变...
        # 转发到后端用户服务
        location ~ ^/api/user {
            proxy_pass $user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 转发到资料服务
        location ~ ^/(materials|media/materials) {
            proxy_pass $materials_service;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 转发到论坛服务
        location ~ ^/api/forum {
            proxy_pass $forum_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 转发到公告服务
        location ~ ^/api/notices {
            proxy_pass $notice_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }
    }